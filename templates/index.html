<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title data-i18n="pageTitle">토스증권 보유 종목</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 40px auto; color: #222; line-height: 1.4; }
  h1 { font-size: 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #e0e0e0; text-align: right; font-size: 14px; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { background: #f7f7f7; white-space: nowrap; }
  .plus { color: #d92626; }
  .minus { color: #2563eb; }
  .summary { display: flex; gap: 24px; margin-top: 12px; }
  .summary div { font-size: 14px; }
  .summary b { display: block; font-size: 18px; }
  .rate-note { font-size: 12px; color: #888; margin-top: 4px; }

  .switch { position: relative; display: inline-block; width: 88px; height: 28px; font-size: 12px; }
  .switch input { display: none; }
  .switch .track {
    position: absolute; inset: 0; background: #2563eb; border-radius: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
    color: #fff; font-weight: 600; user-select: none;
  }
  .switch .thumb {
    position: absolute; top: 2px; left: 2px; width: 42px; height: 24px; background: #fff;
    border-radius: 12px; transition: transform 0.15s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  #currency-toggle:checked ~ .track .thumb { transform: translateX(42px); }

  .lang-switch { display: inline-flex; border: 1px solid #ddd; border-radius: 14px; overflow: hidden; font-size: 12px; }
  .lang-switch button {
    border: none; background: #f7f7f7; color: #666; padding: 6px 12px; cursor: pointer; font-weight: 600;
  }
  .lang-switch button.active { background: #2563eb; color: #fff; }
</style>
</head>
<body>
  <h1>
    <span data-i18n="heading">보유 종목</span>
    <label class="switch">
      <input type="checkbox" id="currency-toggle">
      <span class="track">
        <span>KRW</span><span>USD</span>
        <span class="thumb"></span>
      </span>
    </label>
    <span class="lang-switch" id="lang-switch">
      <button type="button" data-lang="ko" class="active">한국어</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </span>
  </h1>
  <div class="rate-note">1 USD = {{ "{:,.2f}".format(usd_krw_rate) }} KRW</div>

  <div class="summary">
    <div><span data-i18n="totalPurchase">매입금액</span><b class="amount" data-krw="{{ total_purchase.krw }}" data-usd="{{ total_purchase.usd }}"></b></div>
    <div><span data-i18n="marketValue">평가금액</span><b class="amount" data-krw="{{ total_market_value.krw }}" data-usd="{{ total_market_value.usd }}"></b></div>
    <div><span data-i18n="profitLoss">손익</span><b class="amount profit {{ 'plus' if total_profit_loss.krw >= 0 else 'minus' }}" data-krw="{{ total_profit_loss.krw }}" data-usd="{{ total_profit_loss.usd }}" data-rate="{{ (total_profit_loss_rate * 100)|round(2) }}"></b></div>
  </div>

  <table>
    <thead>
      <tr>
        <th data-i18n="colSymbol">종목</th>
        <th data-i18n="colMarket">시장</th>
        <th data-i18n="colQty">수량</th>
        <th data-i18n="colPrice">현재가</th>
        <th data-i18n="colAvgPrice">평균매입가</th>
        <th data-i18n="colMarketValue">평가금액</th>
        <th data-i18n="colReturn">손익률</th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}
      <tr>
        <td><span class="stock-name" data-ko="{{ item.name }}" data-en="{{ item.englishName }}"></span> ({{ item.symbol }})</td>
        <td>{{ item.marketCountry }}</td>
        <td>{{ item.quantity }}</td>
        <td class="amount" data-krw="{{ item.lastPrice.krw }}" data-usd="{{ item.lastPrice.usd }}"></td>
        <td class="amount" data-krw="{{ item.averagePurchasePrice.krw }}" data-usd="{{ item.averagePurchasePrice.usd }}"></td>
        <td class="amount" data-krw="{{ item.marketValue.krw }}" data-usd="{{ item.marketValue.usd }}"></td>
        <td class="{{ 'plus' if item.profitLossRate|float >= 0 else 'minus' }}">{{ (item.profitLossRate|float * 100)|round(2) }}%</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <script src="/static/app.js"></script>
</body>
</html>
